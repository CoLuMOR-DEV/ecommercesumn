<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night Market // Valorant-Style Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body data-page="shop">
    <header class="topbar">
      <div class="brand">NIGHT <span>MARKET</span></div>
      <nav class="nav-actions">
        <a href="./admin.html" class="ghost-btn">Admin Panel</a>
        <button id="openCart" class="cta-btn">Cart <span id="cartCount">0</span></button>
      </nav>
    </header>

    <main class="layout">
      <section class="hero-card">
        <p class="eyebrow">ROTATION</p>
        <h1 id="rotationTitle">Daily Offers</h1>
        <p id="rotationRange" class="subtle"></p>
      </section>

      <section class="grid-section">
        <div class="section-head">
          <h2>Featured Bundle</h2>
        </div>
        <div id="bundleList" class="bundle-grid"></div>
      </section>

      <section class="grid-section">
        <div class="section-head">
          <h2>Shop Rotation</h2>
        </div>
        <div id="productList" class="product-grid"></div>
      </section>
    </main>

    <aside id="cartDrawer" class="cart-drawer hidden">
      <div class="drawer-head">
        <h3>Checkout (Fake)</h3>
        <button id="closeCart" class="icon-btn">✕</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <div class="cart-footer">
        <div class="row-between"><span>Total</span><strong id="cartTotal">$0.00</strong></div>
        <button id="checkoutBtn" class="cta-btn w-full">Complete Fake Checkout</button>
        <p class="subtle tiny">No real payment gateway is used.</p>
      </div>
    </aside>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
